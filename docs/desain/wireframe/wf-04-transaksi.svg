<rect x="48" y="716" width="820" height="52" rx="4" fill="#fafafa" stroke="#666" stroke-width="1.3" stroke-dasharray="7 5"/><text x="60" y="738" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#555">Pesan galat</text><text x="60" y="758" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#333">Harga jual minimal sama dengan harga modal.</text>
<rect x="48" y="786" width="300" height="52" rx="4" fill="#d9d9d9" stroke="#444" stroke-width="1.6"/><text x="198" y="820" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Simpan Transaksi</text>
