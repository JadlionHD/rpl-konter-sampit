<text x="48" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#1f1f1f">Form Transaksi Pulsa / Data / Token</text>
<text x="48" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#333">Nomor HP / ID Pelanggan PLN</text><rect x="48" y="226" width="820" height="48" rx="4" fill="#fff" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4"/><text x="60" y="257" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#888">081234567890</text>
