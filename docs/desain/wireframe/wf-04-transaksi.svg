<text x="48" y="624" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#333">Harga modal (Rp)</text><rect x="48" y="634" width="396" height="48" rx="4" fill="#fff" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4"/><text x="60" y="665" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#888">10500</text>
