<circle cx="1040" cy="500" r="15" fill="#fff" stroke="#222" stroke-width="1.6"/><text x="1040" y="505" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#222">4</text>
<circle cx="1040" cy="760" r="15" fill="#fff" stroke="#222" stroke-width="1.6"/><text x="1040" y="765" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#222">5</text>
<rect x="940" y="160" width="468" height="300" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.4"/>
<text x="956" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1f1f1f">Panduan Cepat</text>
<text x="956" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1f1f1f">• Nomor HP 10–13 digit.</text>
<text x="956" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1f1f1f">• Operator terisi otomatis dari prefix.</text>
<text x="956" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1f1f1f">• Harga jual tidak boleh di bawah modal.</text>
<text x="956" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1f1f1f">• Kasbon wajib nama dan jatuh tempo.</text>
<text x="956" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1f1f1f">• Stok voucher dicek di server.</text>
<rect x="956" y="370" width="436" height="52" rx="4" fill="#fafafa" stroke="#666" stroke-width="1.3" stroke-dasharray="7 5"/><text x="968" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#555">Pesan sukses</text><text x="968" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#333">Transaksi berhasil disimpan.</text>
